<div class="flex flex-col gap-4">
  <div class="flex justify-between items-center">
    <h2 class="text-2xl">Sensores Registrados</h2>
    <button class="bg-blue-500 text-white" (click)="createSensorDialog()">Adicionar sensor</button>
  </div>

  <div class="p-4 grid-grid-cols-2 md:grid-cols-3 gap-4 bg-gray-200">
    @if (!sensorsList().length) {
    <div class="col-span-3 text-center italic text-gray-600">
      Ainda não há sensores cadastrados
    </div>
    }

    @for(sensor of sensorsList(); track sensor.id) {
    <div class="p-4 flex flex-col gap-2 rounded shadow bg-white">
      <div class="text-lg">{{ sensor.name }}</div>

      <div class="flex gap-4">
        <div class="w-full text-xs rounded-full bg-black/10 text-gray-500">
          {{ sensor.min }}
        </div>
        <div class="w-full text-xs rounded-full bg-black/10 text-gray-500">
          {{ sensor.max }}
        </div>
      </div>
    </div>
    }
  </div>
</div>
