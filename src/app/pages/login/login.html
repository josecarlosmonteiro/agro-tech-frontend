<div class="h-screen w-full flex justify-center items-center">
  <form>
    <div class="p-4 flex flex-col gap-4 rounded-lg shadow">
      <h2 class="text-xl">Entrar - Agro Tech</h2>

      <div class="flex flex-col gap-1">
        <label
          for="email"
          class="text-sm italic font-semibold text-gray-500"
          >Email</label
        >
        <input
          id="email"
          type="email"
          required
        />
      </div>

      <div class="flex flex-col gap-1">
        <label
          for="password"
          class="text-sm italic font-semibold text-gray-500"
          >Senha</label
        >
        <input
          id="password"
          type="password"
          required
        />
      </div>

      <a
        href="/cadastro"
        class="text-center underline text-blue-500"
        >Cadastre-se</a
      >

      <button
        class="bg-blue-500 text-white"
        type="submit"
      >
        Entrar
      </button>
    </div>
  </form>
</div>
