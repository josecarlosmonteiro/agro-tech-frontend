<h2 mat-dialog-title>Editar área</h2>
<mat-dialog-content>
  <form
    class="flex flex-col gap-4"
    [formGroup]="updateForm"
    (ngSubmit)="onSubmit()"
  >
    <div class="flex flex-col gap-1">
      <label
        for="name"
        class="text-sm italic font-semibold text-gray-500"
        >Nome</label
      >
      <input
        id="name"
        type="text"
        class="p-2 border rounded"
        formControlName="name"
      />
    </div>

    <div class="flex flex-col gap-1">
      <label
        for="location"
        class="text-sm italic font-semibold text-gray-500"
        >Localização</label
      >
      <input
        id="location"
        type="text"
        class="p-2 border rounded"
        formControlName="location"
      />
    </div>

    <div class="flex flex-col gap-1">
      <label
        for="size"
        class="text-sm italic font-semibold text-gray-500"
        >Tamanho (m²)</label
      >
      <input
        id="size"
        type="number"
        step="0.1"
        class="p-2 border rounded"
        formControlName="size"
      />
    </div>

    <mat-dialog-actions align="end">
      <button
        class="text-gray-500"
        type="button"
        mat-dialog-close
      >
        Cancelar
      </button>
      <button
        class="text-white bg-blue-500"
        [disabled]="!updateForm.valid"
      >
        Confirmar
      </button>
    </mat-dialog-actions>
  </form>
</mat-dialog-content>
