<div class="p-4">
  <div>Tem certeza de que deseja remover a seguinte área cadastrada?</div>

  <div class="mt-4 text-gray-600">
    <strong>{{ data.area.name }} - {{ data.area.size }}m²</strong>
    <div class="italic">{{data.area.location}}</div>
  </div>

  <div class="mt-4 flex justify-end gap-4">
    <button class="p-2 px-4 rounded-full text-gray-500" type="button" mat-dialog-close>Cancelar</button>
    <button class="p-2 px-4 rounded-full bg-red-500 text-white" type="button" [mat-dialog-close]="true"
      (click)="confirmRemoveArea(data.area.id)">Confirmar</button>
  </div>
</div>
