<div class="p-4">
  <form
    [formGroup]="areaForm"
    (ngSubmit)="onSubmit()"
  >
    <div class="flex flex-col gap-4">
      <div class="flex flex-col gap-1">
        <label
          for="name"
          class="text-sm italic font-semibold text-gray-500"
          >Nome</label
        >
        <input
          id="name"
          type="text"
          formControlName="name"
        />
      </div>

      <div class="flex flex-col gap-1">
        <label
          for="size"
          class="text-sm italic font-semibold text-gray-500"
          >Tamanho (m²)</label
        >
        <input
          id="size"
          type="number"
          step="0.1"
          formControlName="size"
        />
      </div>

      <div class="flex justify-end gap-4">
        <button
          type="button"
          class="text-gray-500"
          mat-dialog-close
        >
          Cancelar
        </button>
        <button
          type="submit"
          class="bg-blue-500 text-white"
          [disabled]="!areaForm.valid"
        >
          Confirmar
        </button>
      </div>
    </div>
  </form>
</div>
